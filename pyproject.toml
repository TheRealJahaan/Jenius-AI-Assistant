[project]
name = "jenius"
version = "3.0.0"
description = "Jenius: freight cost anomaly monitor with a Claude-powered analyst assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jahaan Suthar" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
  "S101",  # assert is fine in tests
  "B008",  # FastAPI's Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "E501"]
"eval_harness.py" = ["S603"]  # runs solution.py with this same interpreter
