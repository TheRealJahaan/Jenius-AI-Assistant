[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jenius"
version = "3.0.0"
description = "Deterministic freight-cost anomaly detection with a grounded, zero-hallucination Q&A assistant."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jahaan Suthar" }]
dependencies = []  # runtime is standard library only

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
jenius = "jenius.cli:main"

[tool.setuptools]
packages = ["jenius"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["RUF001", "RUF002", "RUF003", "PT018"]  # ₹ and en-dashes are intentional

[tool.mypy]
python_version = "3.10"
strict = true
files = ["jenius"]
