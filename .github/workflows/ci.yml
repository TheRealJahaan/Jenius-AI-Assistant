name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type-check
        run: mypy
      - name: Test (includes Python/JS parity and golden-output checks)
        run: pytest --cov=jenius --cov-report=term-missing
      - name: Reproducibility + labelled eval
        run: python -m jenius eval

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jenius .
      - name: Smoke test
        run: |
          docker run -d --name jenius -p 8000:8000 jenius
          for i in $(seq 1 20); do curl -fsS localhost:8000/api/health && break; sleep 1; done
          curl -fsS -X POST localhost:8000/api/ask -H 'Content-Type: application/json' \
            -d '{"question":"summary"}' | grep -q "Anomalous route-weeks"
          curl -fsS localhost:8000/ | grep -q "<title>Jenius"
