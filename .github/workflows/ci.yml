# Lint, test on SQLite and on PostgreSQL, check the case-study output, and build the container.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: jenius
          POSTGRES_PASSWORD: jenius
          POSTGRES_DB: jenius_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jenius -d jenius_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Tests (SQLite)
        run: python -m pytest
      - name: Tests (PostgreSQL)
        run: python -m pytest
        env:
          JENIUS_TEST_DATABASE_URL: postgresql://jenius:jenius@localhost:5432/jenius_test
      - name: Migrations apply cleanly to PostgreSQL
        run: python -m alembic upgrade head && python -m alembic check
        env:
          DATABASE_URL: postgresql://jenius:jenius@localhost:5432/jenius_test
      - name: Case-study output is reproducible and correct
        run: python eval_harness.py && git diff --exit-code output_anomalies.csv

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t jenius:ci .
